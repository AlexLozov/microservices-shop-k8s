server.port: ${PORT:8084}
spring.application.name: order-service
app.jwt-secret: ${JWT_SECRET}
app.internal-key: ${INTERNAL_KEY}
management.endpoints.web.exposure.include: health,info
logging.level.root: ${LOG_LEVEL:INFO}
logging.pattern.console: '%d{yyyy-MM-dd HH:mm:ss.SSS} service=order-service level=%-5level requestId=%X{requestId} %logger{36} - %msg%n'
spring.datasource.url: ${DB_URL:jdbc:h2:file:./order;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name: org.h2.Driver
spring.datasource.username: sa
spring.sql.init.mode: always
services.auth-url: ${AUTH_URL:http://localhost:8081}
services.user-url: ${USER_URL:http://localhost:8082}
services.product-url: ${PRODUCT_URL:http://localhost:8083}
services.payment-url: ${PAYMENT_URL:http://localhost:8085}
services.notification-url: ${NOTIFICATION_URL:http://localhost:8086}
