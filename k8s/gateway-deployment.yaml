apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: lab3
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
      - name: gateway
        image: lab3/gateway:local
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: PORT
          value: "8080"
        - name: AUTH_URL
          valueFrom:
            configMapKeyRef:
              name: store-config
              key: AUTH_URL
        - name: USER_URL
          valueFrom:
            configMapKeyRef:
              name: store-config
              key: USER_URL
        - name: PRODUCT_URL
          valueFrom:
            configMapKeyRef:
              name: store-config
              key: PRODUCT_URL
        - name: ORDER_URL
          valueFrom:
            configMapKeyRef:
              name: store-config
              key: ORDER_URL
        - name: PAYMENT_URL
          valueFrom:
            configMapKeyRef:
              name: store-config
              key: PAYMENT_URL
        - name: NOTIFICATION_URL
          valueFrom:
            configMapKeyRef:
              name: store-config
              key: NOTIFICATION_URL
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: store-config
              key: LOG_LEVEL
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: store-secrets
              key: JWT_SECRET
        - name: INTERNAL_KEY
          valueFrom:
            secretKeyRef:
              name: store-secrets
              key: INTERNAL_KEY
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 192Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
