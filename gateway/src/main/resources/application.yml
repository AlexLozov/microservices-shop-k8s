server.port: ${PORT:8080}
spring.application.name: gateway
app.jwt-secret: ${JWT_SECRET}
app.internal-key: ${INTERNAL_KEY}
management.endpoints.web.exposure.include: health,info
logging.level.root: ${LOG_LEVEL:INFO}
logging.pattern.console: '%d{yyyy-MM-dd HH:mm:ss.SSS} service=gateway level=%-5level requestId=%X{requestId} %logger{36} - %msg%n'
services.auth-url: ${AUTH_URL:http://localhost:8081}
services.user-url: ${USER_URL:http://localhost:8082}
services.product-url: ${PRODUCT_URL:http://localhost:8083}
services.order-url: ${ORDER_URL:http://localhost:8084}
services.payment-url: ${PAYMENT_URL:http://localhost:8085}
services.notification-url: ${NOTIFICATION_URL:http://localhost:8086}
